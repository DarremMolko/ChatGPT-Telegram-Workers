[vars]
TELEGRAM_AVAILABLE_TOKENS = "123456:telegram-bot-token"
CHAT_WHITE_LIST = "123456789"
REDIS_URL = "rediss://default:your-password@your-redis-host:6379"

AI_CHAT_PROVIDER = "openai"
AI_IMAGE_PROVIDER = "openai"
AI_ASR_PROVIDER = "openai"
AI_TTS_PROVIDER = "openai"

OPENAI_API_KEY = "sk-..."
OPENAI_API_BASE = "https://api.openai.com/v1"
OPENAI_CHAT_MODEL = "gpt-5.4-mini"
OPENAI_VISION_MODEL = "gpt-5.4-mini"
OPENAI_STT_MODEL = "gpt-4o-mini-transcribe"
OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
OPENAI_IMAGE_MODEL = "gpt-image-1.5"
OPENAI_TTS_VOICE = "alloy"

# Optional: enable OpenAI provider-side tools when using the Responses API.
# USE_OPENAI_BUILDIN = ["webSearch"]
# OPENAI_WEB_SEARCH_CONTEXT_SIZE = "high"

# Optional: use a dedicated model for MCP or built-in tool steps.
# TOOL_MODEL = "gpt-5.4"

# Optional: change text/audio behavior.
# TEXT_OUTPUT = "audio"
# AUDIO_OUTPUT = "audio"

# Optional: configure scheduled deletion in local mode.
# The scheduler only tags bot messages whose type is listed below.
# Allowed values: "tip", "chat"
#
# Example 1: delete only tip/status messages after 60 minutes.
# EXPIRED_TIME = 60
# CRON_CHECK_TIME = "*/5 * * * *"
# SCHEDULE_GROUP_DELETE_TYPE = ["tip"]
# SCHEDULE_PRIVATE_DELETE_TYPE = ["tip"]
#
# Example 2: delete both chat replies and tip messages after 24 hours.
# EXPIRED_TIME = 1440
# CRON_CHECK_TIME = "0 * * * *"
# SCHEDULE_GROUP_DELETE_TYPE = ["tip", "chat"]
# SCHEDULE_PRIVATE_DELETE_TYPE = ["tip", "chat"]
#
# Example 3: keep group chat history, but delete private chat replies after 30 minutes.
# EXPIRED_TIME = 30
# CRON_CHECK_TIME = "*/10 * * * *"
# SCHEDULE_GROUP_DELETE_TYPE = []
# SCHEDULE_PRIVATE_DELETE_TYPE = ["tip", "chat"]

# To enable a generic MCP server:
# USE_MCP = ["demo"]
# MCP_demo = "{\"type\":\"http\",\"url\":\"http://127.0.0.1:3001/mcp\"}"
#
# Other supported transports:
# MCP_demo = "{\"type\":\"sse\",\"url\":\"http://127.0.0.1:3001/sse\"}"
# MCP_demo = "{\"type\":\"stdio\",\"command\":\"npx\",\"args\":[\"-y\",\"@modelcontextprotocol/server-filesystem\",\"/tmp\"]}"
#
# IMPORTANT:
# - The suffix after MCP_ becomes the MCP group name, so MCP_demo pairs with USE_MCP = ["demo"].
# - The value must be a JSON string, not a TOML inline table.

# To use an OpenAI-compatible API instead:
# AI_CHAT_PROVIDER = "oailike"
# AI_IMAGE_PROVIDER = "oailike"
# AI_ASR_PROVIDER = "oailike"
# AI_TTS_PROVIDER = "oailike"
# OAILIKE_API_KEY = "your-key"
# OAILIKE_API_BASE = "https://your-api.example.com/v1"
# OAILIKE_CHAT_MODEL = "gpt-5.4-mini"
# OAILIKE_VISION_MODEL = "gpt-5.4-mini"
# OAILIKE_IMAGE_MODEL = "gpt-image-1.5"
# OAILIKE_STT_MODEL = "your-stt-model"
# OAILIKE_TTS_MODEL = "gpt-4o-mini-tts"

# Optional: force explicit endpoint mode.
# OAILIKE_API_BASE = "https://your-api.example.com/v1/chat/completions"
