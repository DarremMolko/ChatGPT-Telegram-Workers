[vars]

# -----------------------------------------------------------------------------
# 1. Bare Minimum Required For Any Deployment
# -----------------------------------------------------------------------------
# These values are required no matter which provider family you use.
TELEGRAM_AVAILABLE_TOKENS = "123456:telegram-bot-token"
OWNER_ID = "123456789"
REDIS_URL = "rediss://default:your-password@your-redis-host:6379"

# -----------------------------------------------------------------------------
# 2. Provider Minimum Required Settings
# -----------------------------------------------------------------------------
# Pick one provider family.
#
# 2a. OpenAI (default)
# Keep this block enabled if you want first-party OpenAI APIs.
#
AI_CHAT_PROVIDER = "openai"
AI_IMAGE_PROVIDER = "openai"
AI_ASR_PROVIDER = "openai"
AI_TTS_PROVIDER = "openai"

OPENAI_API_KEY = "sk-..."
OPENAI_API_BASE = "https://api.openai.com/v1"
OPENAI_CHAT_MODEL = "gpt-5.4-mini"
OPENAI_VISION_MODEL = "gpt-5.4-mini"
OPENAI_STT_MODEL = "gpt-4o-mini-transcribe"
OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
OPENAI_IMAGE_MODEL = "gpt-image-2"
OPENAI_TTS_VOICE = "alloy"

#
# 2b. OpenAI-compatible
# Uncomment this block instead if you are using an OpenAI-compatible endpoint.
#
# AI_CHAT_PROVIDER = "oailike"
# AI_IMAGE_PROVIDER = "oailike"
# AI_ASR_PROVIDER = "oailike"
# AI_TTS_PROVIDER = "oailike"
#
# OAILIKE_API_KEY = "your-key"
# OAILIKE_API_BASE = "https://your-api.example.com/v1"
# OAILIKE_CHAT_MODEL = "gpt-5.4-mini"
# OAILIKE_VISION_MODEL = "gpt-5.4-mini"
# OAILIKE_IMAGE_MODEL = "gpt-image-2"
# OAILIKE_STT_MODEL = "gpt-4o-mini-transcribe"
# OAILIKE_TTS_MODEL = "gpt-4o-mini-tts"
#
# Optional: force explicit endpoint mode.
# OAILIKE_API_BASE = "https://your-api.example.com/v1/chat/completions"

# -----------------------------------------------------------------------------
# 3. Optional Local HTTP Server
# -----------------------------------------------------------------------------
# The local runtime always uses Telegram polling.
# Set LOCAL_PORT or PORT only if you want the optional local HTTP server with
# GET / and GET /health.
#
# LOCAL_PORT = 8787
# LOCAL_HOSTNAME = "0.0.0.0"
# Optional outbound proxy:
# LOCAL_PROXY = "http://127.0.0.1:7890"
#
# If LOCAL_PORT and PORT are both omitted, no local HTTP server is started.

# -----------------------------------------------------------------------------
# 4. Recommended Telegram Delivery Controls
# -----------------------------------------------------------------------------
# These are not required, but they are useful in most real deployments.
# Optional: restrict Telegram subscriptions to the update types this bot handles.
# TELEGRAM_ALLOWED_UPDATES = ["message", "inline_query", "callback_query", "chosen_inline_result"]

# -----------------------------------------------------------------------------
# 5. Optional Access Bootstrap
# -----------------------------------------------------------------------------
# Optional static bootstrap admins. The owner can add more runtime admins later with /promote.
# ADMIN_WHITE_LIST = "987654321"
# Optional: restrict what admins can use. Supported values:
# "chat", "image", "audio", "document", "settings", "inline"
# ADMIN_AVAILABLE_UTILITIES = ["chat", "settings"]
#
# Optional: OCR supported documents to text through Mistral before sending them to the chat model.
# PDFs still fall back to the native PDF file upload path if OCR fails.
# DOCUMENT_OCR_PROVIDER = "mistral"
# MISTRAL_OCR_API_KEY = "your-mistral-ocr-key"
# MISTRAL_OCR_API_BASE = "https://api.mistral.ai/v1"
# MISTRAL_OCR_MODEL = "mistral-ocr-latest"

# -----------------------------------------------------------------------------
# 6. Common Optional Runtime Tweaks
# -----------------------------------------------------------------------------
# These are common quality-of-life settings after the minimum setup is working.
#
# Optional: use a dedicated model for MCP or built-in tool steps.
# TOOL_MODEL = "gpt-5.4"
#
# Optional: change text/audio behavior.
# TEXT_OUTPUT = "audio"
# AUDIO_OUTPUT = "audio"
#
# Optional: define named /set -p prompt presets.
# Example TOML object form:
# PROMPT = { reviewer = "Review the following code for correctness, regressions, and missing tests." }
# If you set PROMPT in a real server environment variable instead of TOML, use a JSON string.
#
# Optional: cap Telegram attachment downloads at 20 MB.
# TELEGRAM_FILE_DOWNLOAD_MAX_SIZE = 20971520
#
# Optional: show the model/tool footer in replies.
# SHOW_PARTS = ["model", "model_time", "token", "tool", "tool_time"]
# SHOW_TOOL_ARGS_MAX_LENGTH = 80
# Set SHOW_TOOL_ARGS_MAX_LENGTH = -1 to show full tool arguments.
#
# Optional: serialize same-chat execution to avoid overlapping replies.
# Supported values: "queue", "cancel_previous", "drop_if_busy", "parallel"
# CHAT_CONCURRENCY_POLICY = "queue"

# -----------------------------------------------------------------------------
# 7. Optional Debugging And Provider Extras
# -----------------------------------------------------------------------------
# Optional: increase console verbosity.
# LOG_LEVEL = "debug"
#
# Optional: write structured NDJSON traces for runtime, config, request,
# reasoning, and tool-call diagnostics.
# LOG_TO_FILE = "./logs/chatgpt-telegram-workers.debug.ndjson"
#
# Optional: persist the last raw Telegram message payload in Redis for a chat.
# SAVE_LAST_TELEGRAM_MESSAGE = true
#
# Optional: enable OpenAI provider-side tools when using the Responses API.
# USE_OPENAI_BUILDIN = ["webSearch"]
# OPENAI_WEB_SEARCH_CONTEXT_SIZE = "high"

# -----------------------------------------------------------------------------
# 8. Optional Scheduled Cleanup
# -----------------------------------------------------------------------------
# Optional: configure scheduled deletion in local mode.
# The scheduler only tags bot messages whose type is listed below.
# Allowed values: "tip", "chat"
#
# Example 1: delete only tip/status messages after 60 minutes.
# EXPIRED_TIME = 60
# CRON_CHECK_TIME = "*/5 * * * *"
# SCHEDULE_GROUP_DELETE_TYPE = ["tip"]
# SCHEDULE_PRIVATE_DELETE_TYPE = ["tip"]
#
# Example 2: delete both chat replies and tip messages after 24 hours.
# EXPIRED_TIME = 1440
# CRON_CHECK_TIME = "0 * * * *"
# SCHEDULE_GROUP_DELETE_TYPE = ["tip", "chat"]
# SCHEDULE_PRIVATE_DELETE_TYPE = ["tip", "chat"]
#
# Example 3: keep group chat history, but delete private chat replies after 30 minutes.
# EXPIRED_TIME = 30
# CRON_CHECK_TIME = "*/10 * * * *"
# SCHEDULE_GROUP_DELETE_TYPE = []
# SCHEDULE_PRIVATE_DELETE_TYPE = ["tip", "chat"]

# -----------------------------------------------------------------------------
# 9. Advanced Optional MCP Setup
# -----------------------------------------------------------------------------
# To enable a generic MCP server:
# USE_MCP = ["demo"]
# MCP_demo = "{\"type\":\"http\",\"url\":\"http://127.0.0.1:3001/mcp\"}"
#
# Other supported transports:
# MCP_demo = "{\"type\":\"sse\",\"url\":\"http://127.0.0.1:3001/sse\"}"
# MCP_demo = "{\"type\":\"stdio\",\"command\":\"npx\",\"args\":[\"-y\",\"@modelcontextprotocol/server-filesystem\",\"/tmp\"]}"
#
# IMPORTANT:
# - The suffix after MCP_ becomes the MCP group name, so MCP_demo pairs with USE_MCP = ["demo"].
# - The value must be a JSON string, not a TOML inline table.
