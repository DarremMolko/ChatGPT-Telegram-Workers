services:
  chatgpt-telegram-workers:
    container_name: chatgpt-telegram-workers
    build: .
    image: chatgpt-telegram-workers:latest
    environment:
      TELEGRAM_AVAILABLE_TOKENS: ${TELEGRAM_AVAILABLE_TOKENS}
      OWNER_ID: ${OWNER_ID}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Optional: set PORT to enable the local status and /health endpoint.
      # PORT: 8787
    # Optional: publish the local status and /health endpoint.
    # ports:
    #   - "8787:8787"
